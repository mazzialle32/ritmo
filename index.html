<style>

[data-theme=dark]{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--text:#f5f5f7;--mut:#98989f;--line:rgba(255,255,255,.1);--acc:#30d158;--accbg:rgba(48,209,88,.16);--warn:#ff9f0a;--bad:#ff453a;--blue:#0a84ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:var(--text);font-size:16px}
[data-act]{cursor:pointer;touch-action:manipulation}
small,.mut{color:var(--mut)}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 10px) 16px calc(var(--bar) + 96px)}
#tabs{position:absolute;left:0;right:0;bottom:0;height:var(--bar);padding-bottom:var(--padb);display:flex;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);z-index:5}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:var(--mut)}
#tabs button.on{color:var(--acc)}
#tabs svg{width:22px;height:22px}
#fab{position:absolute;right:18px;bottom:calc(var(--bar) + 16px);width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;font-size:34px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:6;display:flex;align-items:center;justify-content:center;padding-bottom:3px}

h1{font-size:30px;margin:2px 0 0;letter-spacing:-.4px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top .sub{font-size:13px;color:var(--mut);margin-top:-2px}
.nav{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--acc)}
.ib[disabled]{opacity:.3}
.pill{height:36px;padding:0 12px;border-radius:18px;background:var(--card);font-size:13px;display:flex;align-items:center;gap:6px;color:var(--mut)}
.pill b{color:var(--acc)}
.spin{animation:sp 1s linear infinite;display:inline-block}

.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.hero{display:flex;gap:14px;align-items:center}
.ringwrap{width:150px;height:150px;flex:none}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.legend .lg{font-size:12px;font-weight:600}
.legend b{display:block;font-size:22px;letter-spacing:-.3px;line-height:1.05}
.legend b small{font-size:12px;font-weight:500;margin-left:2px}
.steps{margin-top:10px;padding-top:10px;border-top:.5px solid var(--line);font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);text-transform:uppercase;letter-spacing:.4px}
.big{font-size:46px;font-weight:700;letter-spacing:-1.2px;line-height:1.1;margin-top:6px}
.big small{font-size:16px;font-weight:500;margin-left:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 12px}
.two>div{background:var(--card2);border-radius:14px;padding:10px 12px}
.two small{display:block;font-size:12px}
.two b{font-size:22px;letter-spacing:-.4px}
.two em{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:1px}
.bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .4s}
.bar.over i{background:var(--warn)}
.left{margin-top:8px;font-size:14px}
.note{margin-top:6px;font-size:12px;color:var(--mut)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mac b{display:block;font-size:20px}
.mac small{font-size:12px}
.stack{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-top:10px;background:var(--card2)}
.stack i{display:block;height:100%}
.slot{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 4px}
.slot b{font-size:15px}
.slot small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:.5px solid var(--line)}
.row:first-of-type{border-top:0}
.row .em{font-size:26px;width:34px;text-align:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-weight:600;overflow:hidden;line-height:1.25}
.row .tx small{font-size:12.5px}
.row .kc{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .x{width:30px;height:30px;border-radius:50%;color:var(--mut);font-size:15px;display:flex;align-items:center;justify-content:center;background:var(--card2)}
.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
[data-theme=dark] .seg button.on{background:#636366;color:#fff}
.set{background:var(--card);border-radius:16px;margin-bottom:6px;overflow:hidden}
.sl{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:18px 14px 6px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-top:.5px solid var(--line);min-height:46px}
.srow:first-child{border-top:0}
.srow input[type=text],.srow input[type=number],.srow input:not([type]),.srow input[type=url]{width:55%;text-align:right;border:0;background:none;outline:none}
.srow input::placeholder{color:var(--mut);opacity:.6}
.srow .seg{width:62%}
.link{color:var(--acc);font-weight:600}
.danger{color:var(--bad)}
.foot{text-align:center;font-size:12px;color:var(--mut);margin:20px 0}
.hint{font-size:12.5px;color:var(--mut);margin:6px 14px 0}

@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}

.sh-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px;flex:none}
.sh-h b{font-size:18px}

.srch{display:flex;gap:8px;margin-bottom:10px}
.srch input{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:var(--card);padding:0 14px;outline:none}
.srch button{width:48px;height:44px;border-radius:12px;background:var(--acc);font-size:22px}
.res .row{cursor:pointer}
.fld{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:0 14px;height:48px;margin-bottom:8px}
.fld label{flex:1;color:var(--mut);font-size:14px}
.fld input{width:45%;text-align:right;border:0;background:none;outline:none;font-size:18px;font-weight:600}

.gb{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:12.5px;font-weight:600}
.gb span{display:block;font-size:24px;margin-bottom:2px}
.gb.on{outline:2px solid var(--acc);background:var(--accbg)}
.prev{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;text-align:center}
.prev .n{font-size:40px;font-weight:700;letter-spacing:-1px}
.prev .n small{font-size:15px}
.prev .m{font-size:13px;color:var(--mut)}
.btn{display:block;width:100%;height:50px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:17px;margin-top:10px}
[data-theme=dark] .btn{color:#04210d}
.btn.sec{background:var(--card);color:var(--text)}
.btn.del{background:var(--card);color:var(--bad)}
.lnk{display:flex;justify-content:center;gap:22px;margin-top:10px}
.guide ol{padding-left:20px;margin:8px 0}
.guide li{margin:7px 0;font-size:14.5px}
.guide code{background:var(--card);border-radius:6px;padding:1px 5px;font-size:12.5px;word-break:break-all}
#scan{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;color:#fff}
#scan.on{display:flex}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
.sbox{position:absolute;left:8%;right:8%;top:30%;height:26%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.sbox::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff453a;opacity:.85}
.sbar{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(var(--sab) + 14px);background:rgba(0,0,0,.72);display:flex;flex-direction:column;gap:10px}
.sbar .t{text-align:center;font-size:14px}
.sbar .m{display:flex;gap:8px}
.sbar input{flex:1;height:44px;border-radius:12px;border:0;padding:0 12px;background:#2c2c2e;color:#fff;outline:none}
.sbar button{height:44px;padding:0 16px;border-radius:12px;background:#2c2c2e;font-weight:600}
.sclose{position:absolute;top:calc(var(--sat) + 12px);right:14px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);font-size:20px;color:#fff;z-index:2}
#toast{position:fixed;left:14px;right:14px;bottom:calc(var(--bar) + 14px);z-index:40;background:#2c2c2e;color:#fff;border-radius:16px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translateY(300%);opacity:0;pointer-events:none;transition:transform .28s ease,opacity .28s;touch-action:none}
#toast.on{transform:none;opacity:1;pointer-events:auto}
#toast button{color:#30d158;font-weight:700;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
button,[data-act]{transition:transform .12s ease,opacity .12s ease,background .2s}
button:active,[data-act]:not(#modal):active{opacity:.55;transform:scale(.96)}
.row:active,.hrow:active{transform:none;opacity:1;background:var(--card2);border-radius:10px}
#tabs button:active{transform:scale(.9)}
.row.flash{animation:fl 1.3s ease-out;border-radius:10px}
@keyframes fl{0%{background:var(--accbg)}100%{background:transparent}}
.ok{color:var(--acc)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.8);opacity:.4}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:.5px solid var(--line);cursor:pointer}
.hrow:first-of-type{border-top:0}
.hrow .d{flex:1;min-width:0}
.hrow .d b{display:block;font-weight:600}
.hrow .d small{font-size:12.5px}
.hrow .v{font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>

/* ---------- calcoli ---------- */
function bmr(){const p=S.profile;return Math.max(800,10*p.weight+6.25*p.height-5*p.age+(p.sex==='f'?-161:5))}
function mealK(m){return m.k*m.g/100}
function day(d){
  const meals=S.meals.filter(m=>m.d===d),acts=S.acts.filter(a=>a.d===d),h=S.health[d]||null;
  let intake=0,P=0,C=0,F=0;
  meals.forEach(m=>{const x=m.g/100;intake+=m.k*x;P+=m.p*x;C+=m.c*x;F+=m.f*x});
  const manual=acts.reduce((s,a)=>s+a.k,0);
  const active=(h?h.a||0:0)+manual;
  const isToday=d===todayS();
  const n=new Date(),frac=isToday?(n.getHours()*60+n.getMinutes())/1440:1;
  const B=bmr(),basalNow=B*frac,burnedNow=basalNow+active,expected=B+active;
  const delta=S.aim.type==='deficit'?-S.aim.delta:S.aim.type==='surplus'?S.aim.delta:0;
  const budget=expected+delta,left=budget-intake,net=intake-burnedNow,proj=intake-expected;
  return{d,meals,acts,h,intake,P,C,F,manual,active,B,basalNow,burnedNow,expected,budget,left,net,proj,delta,isToday,has:!!(meals.length||acts.length||h)};
}
function statusOf(net){const t=100;return net<-t?'def':net>t?'sur':'maint'}
const STAT={def:'Deficit',maint:'Mantenimento',sur:'Surplus'};
function statColor(st){const goal={deficit:'def',maintain:'maint',surplus:'sur'}[S.aim.type];return st===goal?'var(--acc)':'var(--warn)'}
const AIMTXT=()=>S.aim.type==='deficit'?'deficit di '+S.aim.delta+' kcal':S.aim.type==='surplus'?'surplus di '+S.aim.delta+' kcal':'mantenimento';

/* ---------- anelli ---------- */
function rings(a,b,c){
  const spec=[[66,'#fa114f',a],[46,'#92e82a',b],[26,'#1eeaef',c]];
  let o='<svg viewBox="0 0 160 160" width="100%" height="100%">';
  spec.forEach(([r,col,f])=>{
    const C=2*Math.PI*r,ff=Math.max(0.004,Math.min(1,f||0));
    o+=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${col}" stroke-opacity=".22" stroke-width="16"/>`;
    o+=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-ff)).toFixed(1)}" transform="rotate(-90 80 80)"/>`;
    if(f>1){const ang=(f%1)*360;o+=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-(f%1||0.004))).toFixed(1)}" transform="rotate(-90 80 80)"/>`}
  });
  return o+'</svg>';
}

}

  ${D.isToday?`<div class="note">A fine giornata, se non ti muovi più: ${sgn(D.proj)} kcal. Il basale è una stima dai tuoi dati.</div>`:''}</section>`;

  if(D.intake>0){

function vHist(){
  const N=view.range,t=todayS(),days=[];
  for(let i=N-1;i>=0;i--)days.push(day(addDays(t,-i)));
  const W=340,H=150,base=H/2+4;
  const mx=Math.max(500,...days.map(d=>d.has?Math.abs(d.net):0));
  const bw=W/N;
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="currentColor" stroke-opacity=".25"/>`;
  days.forEach((d,i)=>{
    const x=i*bw+bw*.18,w=bw*.64;
    if(!d.has||!d.meals.length){svg+=`<rect x="${x}" y="${base-1}" width="${w}" height="2" rx="1" fill="currentColor" opacity=".25"/>`;return}
    const hh=Math.max(2,Math.abs(d.net)/mx*(H/2-10));
    const y=d.net<0?base:base-hh;
    svg+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="3" fill="${d.net<0?'var(--acc)':'var(--warn)'}"/>`;
  });
  svg+='</svg>';
  const withMeals=days.filter(d=>d.meals.length);
  const avg=withMeals.length?withMeals.reduce((s,d)=>s+d.net,0)/withMeals.length:0;
  const avgIn=withMeals.length?withMeals.reduce((s,d)=>s+d.intake,0)/withMeals.length:0;
  let o=`<div class="top"><div><h1>Storico</h1><div class="sub">Bilancio giornaliero (assunte − consumate)</div></div></div>
  <div class="seg" style="margin-bottom:12px">${[7,14,30].map(n=>`<button class="${view.range===n?'on':''}" data-act="range" data-n="${n}">${n} giorni</button>`).join('')}</div>
  <section class="card"><div style="color:var(--text)">${svg}</div>
  <div class="two" style="margin-bottom:0"><div><small>Bilancio medio</small><b>${withMeals.length?sgn(avg):'—'}</b><em>sui giorni con pasti</em></div><div><small>Assunte medie</small><b>${withMeals.length?fmt(avgIn):'—'}</b><em>kcal al giorno</em></div></div>
  <div class="note">Verde = deficit, arancione = surplus. Oggi è parziale.</div></section><section class="card"><h3>Giorni</h3>`;
  const list=days.slice().reverse().filter(d=>d.has);
  if(!list.length)o+=`<div class="empty">Nessun dato in questo periodo.</div>`;
  list.forEach(d=>{
    const st=statusOf(d.net);
    o+=`<div class="hrow" data-act="open-day" data-d="${d.d}"><div class="d"><b>${dayTitle(d.d)}</b><small>${toDate(d.d).toLocaleDateString('it-IT',{day:'numeric',month:'short'})} · ${fmt(d.intake)} assunte · ${fmt(d.burnedNow)} consumate</small></div><div class="v" style="color:${d.meals.length?statColor(st):'var(--mut)'}">${d.meals.length?sgn(d.net):'—'}</div></div>`;
  });
  return o+`</section>`;
}

/* ---------- lettore codici a barre (EAN-13 / UPC-A) ---------- */
const PL=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const PR=PL.map(s=>s.split('').map(c=>c==='0'?'1':'0').join(''));
const PG=PR.map(s=>s.split('').reverse().join(''));
const PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const runLens=s=>{const r=[];let l=1;for(let i=1;i<s.length;i++){if(s[i]===s[i-1])l++;else{r.push(l);l=1}}r.push(l);return r};
const WL=PL.map(runLens),WG=PG.map(runLens),WR=PR.map(runLens);
function matchDigit(w,sets){
  const t=w[0]+w[1]+w[2]+w[3];if(t<4)return null;
  const nw=w.map(x=>x/t*7);let best=null,bd=1e9;
  sets.forEach(([tag,W])=>W.forEach((pw,d)=>{let s=0;for(let i=0;i<4;i++)s+=(nw[i]-pw[i])**2;if(s<bd){bd=s;best=[tag,d]}}));
  return bd<1.4?best:null;
}
function eanCheck(c){let s=0;for(let i=0;i<12;i++)s+=(+c[i])*(i%2?3:1);return (10-s%10)%10===+c[12]}
function tryRuns(rs){
  for(let i=1;i+59<=rs.length;i++){
    if(rs[i][0]!==1)continue;
    const a=rs[i][1],b=rs[i+1][1],c=rs[i+2][1],m=(a+b+c)/3;
    if(m<1||Math.abs(a-m)>m*.5||Math.abs(b-m)>m*.5||Math.abs(c-m)>m*.5)continue;
    if(rs[i-1][1]<m*3)continue;
    let p=i+3,par='',dig='',ok=true;
    for(let k=0;k<6;k++){
      const r=matchDigit([rs[p][1],rs[p+1][1],rs[p+2][1],rs[p+3][1]],[['L',WL],['G',WG]]);
      if(!r){ok=false;break}par+=r[0];dig+=r[1];p+=4;
    }
    if(!ok)continue;
    const first=PAR.indexOf(par);if(first<0)continue;
    p+=5;
    for(let k=0;k<6;k++){
      const r=matchDigit([rs[p][1],rs[p+1][1],rs[p+2][1],rs[p+3][1]],[['R',WR]]);
      if(!r){ok=false;break}dig+=r[1];p+=4;
    }
    if(!ok)continue;
    const code=String(first)+dig;
    if(eanCheck(code))return code;
  }
  return null;
}
function decodeRow(g,dbg){
  const n=g.length;if(n<80)return null;
  // soglia locale = metà tra il minimo e il massimo in una finestra mobile (regge ombre e sfondi chiari)
  const B=8,nb=Math.ceil(n/B),bmin=new Float32Array(nb),bmax=new Float32Array(nb);
  for(let b=0;b<nb;b++){let lo=255,hi=0;for(let i=b*B;i<Math.min(n,b*B+B);i++){const x=g[i];if(x<lo)lo=x;if(x>hi)hi=x}bmin[b]=lo;bmax[b]=hi}
  const hw=Math.max(3,Math.round(n/B/5));
  const bits=new Uint8Array(n);
  for(let i=0;i<n;i++){
    const bi=(i/B)|0;let lo=255,hi=0;
    for(let b=Math.max(0,bi-hw);b<=Math.min(nb-1,bi+hw);b++){if(bmin[b]<lo)lo=bmin[b];if(bmax[b]>hi)hi=bmax[b]}
    const sm=(g[Math.max(0,i-1)]+g[i]+g[Math.min(n-1,i+1)])/3;
    bits[i]=(hi-lo>40&&sm<(lo+hi)/2)?1:0;
  }
  let rs=[];let v=bits[0],l=1;
  for(let i=1;i<n;i++){if(bits[i]===v)l++;else{rs.push([v,l]);v=bits[i];l=1}}rs.push([v,l]);
  // tolgo i "singhiozzi" di 1-2 pixel dovuti al rumore: li fondo con i vicini
  const lens=rs.map(r=>r[1]).sort((a,b)=>a-b),med=lens[lens.length>>1]||1,tmin=Math.max(1.5,med*0.35);
  for(let pass=0;pass<4;pass++){
    let changed=false;const out=[];
    for(let i=0;i<rs.length;i++){
      const r=rs[i];
      if(r[1]<tmin&&out.length&&i+1<rs.length){const nx=rs[i+1];const pv=out[out.length-1];pv[1]+=r[1]+nx[1];i++;changed=true}
      else out.push([r[0],r[1]]);
    }
    rs=out;if(!changed)break;
  }
  if(dbg)return rs;
  if(rs.length<59)return null;
  return tryRuns(rs)||tryRuns(rs.slice().reverse());
}
window.RT={decodeRow};

let stream=null,scanTimer=null,scanBusy=false;
async function startScan(){
  const ov=$('#scan');
  ov.innerHTML=`<video id="vid" playsinline muted autoplay></video><div class="sbox"></div><button class="sclose" data-act="scan-close">✕</button>
  <div class="sbar"><div class="t" id="st">Inquadra il codice a barre, in orizzontale</div><div class="m"><input id="bcin" inputmode="numeric" placeholder="oppure scrivi il numero" autocomplete="off"><button data-act="scan-manual">Cerca</button></div></div>`;
  ov.classList.add('on');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    const v=$('#vid');v.srcObject=stream;await v.play();
    const bd=('BarcodeDetector' in window)?new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}):null;
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    let last='',cnt=0;
    scanTimer=setInterval(async()=>{
      if(scanBusy||!v.videoWidth)return;scanBusy=true;
      try{
        let code=null;
        if(bd){const r=await bd.detect(v);if(r.length)code=r[0].rawValue}
        if(!code){
          const vw=v.videoWidth,vh=v.videoHeight,sw=Math.min(900,vw),sh=Math.round(vh*sw/vw);
          cv.width=sw;cv.height=sh;cx.drawImage(v,0,0,sw,sh);
          const y0=Math.floor(sh*.28),y1=Math.floor(sh*.62),img=cx.getImageData(0,0,sw,sh).data;
          for(let y=y0;y<=y1&&!code;y+=Math.max(2,Math.floor((y1-y0)/10))){
            const g=new Float32Array(sw);
            for(let x=0;x<sw;x++){const o=(y*sw+x)*4;g[x]=img[o]*.3+img[o+1]*.59+img[o+2]*.11}
            code=decodeRow(g);
          }
        }
        if(code){if(code===last)cnt++;else{last=code;cnt=1}if(cnt>=2){stopScan();foundCode(code)}}
      }catch(e){}
      scanBusy=false;
    },140);
  }catch(e){
    $('#st').textContent='Fotocamera non disponibile: scrivi il numero sotto il codice.';
  }
}
function stopScan(){
  clearInterval(scanTimer);scanTimer=null;scanBusy=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const ov=$('#scan');ov.classList.remove('on');ov.innerHTML='';
}
async function lookupBarcode(code){
  const my=S.custom.find(x=>x.bc===code);if(my)return Object.assign({my:1},my);
  if(S.off[code])return S.off[code];
  const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments,serving_quantity');
  const j=await r.json();if(j.status!==1||!j.product)return null;
  const n=j.product.nutriments||{};
  let k=n['energy-kcal_100g'];if(k==null&&n['energy_100g']!=null)k=n['energy_100g']/4.184;
  if(k==null)return null;
  const sq=parseFloat(j.product.serving_quantity);
  const f={e:'📦',n:(j.product.product_name||'Prodotto')+(j.product.brands?' – '+String(j.product.brands).split(',')[0]:''),k:+k,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0,pg:sq>0?sq:100,pl:sq>0?'porzione':'100 g',bc:code};
  S.off[code]=f;save();return f;
}
async function foundCode(code){
  setSheet('Codice a barre',`<div class="empty">Cerco ${esc(code)}…</div>`);
  try{
    const f=await lookupBarcode(code);
    if(f){ADD={f,g:f.pg,slot:slotNow()};detailSheet();}
    else setSheet('Prodotto non trovato',`<div class="empty">Il codice ${esc(code)} non è nel database.</div><button class="btn" data-act="newfood" data-bc="${esc(code)}">Inseriscilo tu</button><button class="btn sec" data-act="add-meal">Torna alla ricerca</button>`);
  }catch(e){
    setSheet('Nessuna connessione',`<div class="empty">Per cercare il prodotto serve la rete.<br>Codice: ${esc(code)}</div><button class="btn" data-act="newfood" data-bc="${esc(code)}">Inseriscilo a mano</button><button class="btn sec" data-act="add-meal">Torna alla ricerca</button>`);
  }
}

/* ---------- sincronizzazione Apple Watch ---------- */
let lastTry=0;
function softRender(){const a=document.activeElement;if(a&&a.tagName==='INPUT')return;render()}
async function doSync(manual){
  if(!S.sync.url||!S.sync.key){if(manual)toast('Imposta prima indirizzo e chiave');return}
  if(syncing)return;syncing=true;lastTry=Date.now();softRender();
  try{
    const u=S.sync.url+(S.sync.url.includes('?')?'&':'?')+'action=get&key='+encodeURIComponent(S.sync.key);
    const r=await fetch(u,{cache:'no-store'});const j=await r.json();
    if(!j.ok){syncing=false;softRender();if(manual)toast('Chiave non valida');return}
    Object.entries(j.days||{}).forEach(([d,x])=>{const prev=S.health[d]||{};S.health[d]={a:+x.a||0,s:+x.s||0,e:+x.e||0,p:S.standManual?(prev.p||0):(+x.p||0),t:x.t||Date.now(),src:'watch'}});
    S.lastSync=Date.now();syncOkT=Date.now();save();syncing=false;softRender();setTimeout(softRender,4100);
    if(manual)toast('Dati dell\'Watch aggiornati ✓ · '+hhmm(S.lastSync));
  }catch(e){syncing=false;softRender();if(manual)toast('Sincronizzazione non riuscita: controlla rete e indirizzo')}
}

/* ---------- azioni ---------- */
function setPath(path,val){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}
function delWithUndo(arr,id,msg){
  const i=S[arr].findIndex(x=>x.id===id);if(i<0)return;
  const [it]=S[arr].splice(i,1);save();render();
  toast(msg,'Annulla',()=>{S[arr].splice(Math.min(i,S[arr].length),0,it);save();render()});
}
const ACT={
  tab(el){view.tab=el.dataset.id;render();$('#screen').scrollTop=0},
  'day-prev'(){view.date=addDays(view.date,-1);render()},
  'day-next'(){if(view.date<todayS()){view.date=addDays(view.date,1);render()}},
  'open-day'(el){view.date=el.dataset.d;view.tab='today';render();$('#screen').scrollTop=0},
  range(el){view.range=+el.dataset.n;render()},
  fab(){fabSheet()},
  close(){closeModal()},
  bd(el,e){if(e.target===el)closeModal()},
  'add-meal'(){addMealSheet()},
  back(){addMealSheet()},
  pick(el){const f=CUR[+el.dataset.i];if(!f)return;ADD={f,g:f.pg,slot:slotNow()};detailSheet()},
  variant(el){const f=ADD.f,crude=f.alt?f:f.base;ADD.f=el.dataset.v==='0'?crude:crude.alt;ADD.g=ADD.f.pg;detailSheet()},
  'to-pantry'(){
    const g=num($('#gr').value),f=ADD.f;if(!(g>0)){toast('Inserisci una quantità');return}
    const it=pantryItem(f);it.pg=g;it.pl='tua porzione';
    S.pantry=S.pantry.filter(x=>x.n!==it.n);S.pantry.unshift(it);save();render();
    toast('★ Salvato in Dispensa: '+esc(it.n)+' · '+fmt(g)+' g');
  },
  mult(el){ADD.g=Math.round(ADD.f.pg*+el.dataset.m*10)/10;$('#gr').value=ADD.g;updPrev()},
  slot(el){ADD.slot=el.dataset.s;document.querySelectorAll('[data-act=slot]').forEach(b=>b.classList.toggle('on',b===el))},
  'add-ok'(){
    const g=num($('#gr').value);if(!(g>0)){toast('Inserisci una quantità');return}
    const f=ADD.f;
    if(ADD.edit){const m=S.meals.find(x=>x.id===ADD.edit);if(m){m.g=g;m.slot=ADD.slot}save();closeModal();render();toast('Salvato');return}
    S.meals.push({id:uid(),d:view.date,t:hhmm(),slot:ADD.slot,n:fname(f),e:f.e,g,k:f.k,p:f.p,c:f.c,f:f.f});
    S.recent=[fname(f)].concat(S.recent.filter(x=>x!==fname(f))).slice(0,10);
    const id=S.meals[S.meals.length-1].id;flashId=id;
    save();closeModal();render();
    toast(esc(fname(f))+' · '+fmt(f.k*g/100)+' kcal','Annulla',()=>{S.meals=S.meals.filter(m=>m.id!==id);save();render()});
  },
  'edit-meal'(el){
    const m=S.meals.find(x=>x.id===el.dataset.id);if(!m)return;
    if(m.q){quickSheet(m.id);return}
    ADD={f:{e:m.e,n:m.n,k:m.k,p:m.p,c:m.c,f:m.f,pg:m.pg||100,pl:m.pl||'porzione'},g:m.g,slot:m.slot,edit:m.id};detailSheet();
  },
  'del-meal'(el){delWithUndo('meals',el.dataset.id,'Pasto eliminato')},
  'del-meal-close'(el){closeModal();delWithUndo('meals',el.dataset.id,'Pasto eliminato')},
  quick(){quickSheet()},
  qslot(el){document.querySelectorAll('[data-act=qslot]').forEach(b=>b.classList.toggle('on',b===el))},
  'quick-ok'(el){
    const k=num($('#qk').value);if(!(k>=0)){toast('Inserisci le calorie');return}
    const n=$('#qn').value.trim()||'Pasto',slot=(document.querySelector('[data-act=qslot].on')||{dataset:{s:slotNow()}}).dataset.s;
    const id=el.dataset.id;
    if(id){const m=S.meals.find(x=>x.id===id);if(m){m.n=n;m.k=k;m.slot=slot}}
    else{const nid=uid();flashId=nid;S.meals.push({id:nid,d:view.date,t:hhmm(),slot,n,e:'🍽️',g:100,k,p:0,c:0,f:0,q:1})}
    save();closeModal();render();toast('Aggiunto · '+fmt(k)+' kcal');
  },
  newfood(el){newFoodSheet(el.dataset.bc||'')},
  'newfood-ok'(){
    const n=$('#nn').value.trim(),k=num($('#nk').value);
    if(!n||!(k>=0)){toast('Servono nome e calorie');return}
    const pg=num($('#ng').value);
    const f={e:'⭐',n,k,p:num($('#np').value)||0,c:num($('#nc').value)||0,f:num($('#nf').value)||0,pg:pg>0?pg:100,pl:pg>0?'porzione':'100 g'};
    const bc=$('#nbc').value;if(bc)f.bc=bc;
    S.custom=S.custom.filter(x=>x.n!==n);S.custom.unshift(f);
    if($('#ntp').value==='1'){S.pantry=S.pantry.filter(x=>x.n!==n);S.pantry.unshift(pantryItem(f));save();closeModal();render();toast('★ Aggiunto alla Dispensa: '+esc(n));return}
    save();
    ADD={f:Object.assign({my:1},f),g:f.pg,slot:slotNow()};detailSheet();
  },
  scan(){startScan()},
  'scan-close'(){stopScan()},
  'scan-manual'(){const c=($('#bcin').value||'').replace(/\D/g,'');if(c.length<8){toast('Il numero è troppo corto');return}stopScan();foundCode(c)},
  'pan-add'(){panAddSheet()},
  'pan-new'(){newFoodSheet('',true)},
  'pan-toggle'(el){
    const f=PCUR[+el.dataset.i];if(!f)return;const n=fname(f);
    if(inPantry(n))S.pantry=S.pantry.filter(x=>x.n!==n);else S.pantry.push(pantryItem(f));
    save();const q=($('#pq')||{value:''}).value;$('#pres').innerHTML=panResHTML(q);render();
  },
  'pan-use'(el){
    const f=S.pantry[+el.dataset.i];if(!f)return;
    const id=uid();flashId=id;
    S.meals.push({id,d:view.date,t:hhmm(),slot:slotNow(),n:f.n,e:f.e,g:f.pg,k:f.k,p:f.p,c:f.c,f:f.f,pl:f.pl});
    S.recent=[f.n].concat(S.recent.filter(x=>x!==f.n)).slice(0,10);save();
    el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
    toast('Aggiunto a '+dayTitle(view.date).toLowerCase()+': '+esc(f.n)+' · '+fmt(f.k*f.pg/100)+' kcal','Annulla',()=>{S.meals=S.meals.filter(m=>m.id!==id);save();render()});
  },
  'pan-edit'(el){panEditSheet(+el.dataset.i)},
  'pan-edit-ok'(){const g=num($('#pe-g').value);if(!(g>0)){toast('Inserisci una quantità');return}const f=S.pantry[PE.i];f.pg=g;f.pl='tua porzione';save();closeModal();render();toast('Quantità salvata')},
  'pan-del'(){const f=S.pantry[PE.i];S.pantry.splice(PE.i,1);save();closeModal();render();toast('Tolto dalla Dispensa','Annulla',()=>{S.pantry.splice(Math.min(PE.i,S.pantry.length),0,f);save();render()})},
  'add-act'(){AC={i:0,m:30,k:0,touched:false};AC.k=actKcal();actSheet()},
  'act-pick'(el){AC.i=+el.dataset.i;if(!AC.touched)AC.k=actKcal();document.querySelectorAll('[data-act=act-pick]').forEach(b=>b.classList.toggle('on',b===el));$('#ak').value=AC.k},
  'act-ok'(){
    const m=num($('#am').value),k=num($('#ak').value);
    if(!(m>0)||!(k>=0)){toast('Controlla durata e calorie');return}
    const a=ACTS[AC.i];const id=uid();
    S.acts.push({id,d:view.date,t:hhmm(),n:a[1],e:a[0],m:Math.round(m),k:Math.round(k)});
    save();closeModal();render();toast(a[1]+' · −'+fmt(k)+' kcal','Annulla',()=>{S.acts=S.acts.filter(x=>x.id!==id);save();render()});
  },
  'del-act'(el){delWithUndo('acts',el.dataset.id,'Attività eliminata')},
  'add-rings'(){ringsSheet()},
  'rings-ok'(){
    const g=id=>{const v=num($(id).value);return v>0?v:0};
    S.health[view.date]={a:g('#r-a'),s:g('#r-s'),e:g('#r-e'),p:g('#r-p'),t:Date.now(),src:'manual'};
    save();closeModal();render();toast('Anelli salvati');
  },
  set(el){
    let v=el.dataset.val;if(el.dataset.path==='aim.delta')v=+v;if(el.dataset.path==='standManual')v=(v==='1');
    setPath(el.dataset.path,v);save();
    if(el.dataset.path==='theme')applyTheme();
    render();
  },
  'sync-now'(){doSync(true)},
  'sync-now-close'(){closeModal();doSync(true)},
  guide(){guideSheet()},
  export(){
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const file=new File([blob],'ritmo-backup-'+todayS()+'.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove()}
  },
  reset(){setSheet('Cancellare tutto?',`<div class="empty">Elimina pasti, attività, anelli e impostazioni da questo telefono. Non si può annullare. Se vuoi, fai prima un backup.</div><button class="btn del" data-act="reset-ok">Cancella tutto</button><button class="btn sec" data-act="close">Annulla</button>`)},
  'reset-ok'(){S=fresh();save();closeModal();applyTheme();render();welcome()},
  'toast-act'(){const f=toastFn;toastFn=null;hideToast();f&&f()},
  'welcome-ok'(){
    const age=num($('#w-age').value),w=num($('#w-w').value),h=num($('#w-h').value);
    if(!(age>10&&age<110)||!(w>25&&w<300)||!(h>100&&h<250)){toast('Controlla età, peso e altezza');return}
    S.profile.age=age;S.profile.weight=w;S.profile.height=h;S.onboarded=true;save();closeModal();render();
  },
  wsex(el){S.profile.sex=el.dataset.s;document.querySelectorAll('[data-act=wsex]').forEach(b=>b.classList.toggle('on',b===el))}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){$('#res').innerHTML=resHTML(t.value)}
  else if(t.id==='pq'){$('#pres').innerHTML=panResHTML(t.value)}
  else if(t.id==='pe-g'&&PE){const g=num(t.value)||0;$('#pe-k').innerHTML=fmt(S.pantry[PE.i].k*g/100)+'<small> kcal</small>'}
  else if(t.id==='gr'&&ADD){const g=num(t.value);ADD.g=g>0?g:0;updPrev()}
  else if(t.id==='am'&&AC){AC.m=num(t.value)||0;if(!AC.touched){AC.k=actKcal();$('#ak').value=AC.k}}
  else if(t.id==='ak'&&AC){AC.touched=true}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.set){
    const path=t.dataset.set;let v=t.value;
    if(t.type==='number'){v=num(v);if(!isFinite(v)||v<0)return}
    else v=v.trim();
    setPath(path,v);save();
    if(path.startsWith('profile.')||path.startsWith('goals.')||path.startsWith('aim.'))render();
  }else if(t.id==='imp'&&t.files&&t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{try{const j=JSON.parse(rd.result);if(j&&j.v===1){S=Object.assign(fresh(),j);save();applyTheme();render();toast('Backup importato ✓')}else toast('File non valido')}catch(err){toast('File non valido')}};
    rd.readAsText(t.files[0]);
  }
});

/* ---------- tastiera iOS: tieni il foglio sopra la tastiera ---------- */
if(window.visualViewport){
  const upd=()=>document.documentElement.style.setProperty('--vh',window.visualViewport.height+'px');
  window.visualViewport.addEventListener('resize',upd);upd();
}
document.addEventListener('focusin',e=>{
  if(e.target.closest&&e.target.closest('.sh-b'))setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},300);
});

/* ---------- benvenuto ---------- */
function welcome(){
  const p=S.profile;
  openModal(`<div class="sheet"><div class="grab"></div><div class="sh-h"><span></span><b>Benvenuto in Ritmo</b><span></span></div><div class="sh-b">
  <p class="mut" style="margin:2px 2px 10px;font-size:14px">Con questi dati stimo quante calorie consuma il tuo corpo a riposo. Restano solo su questo telefono.</p>
  <div class="chips"><button class="chip ${p.sex==='m'?'on':''}" data-act="wsex" data-s="m">Uomo</button><button class="chip ${p.sex==='f'?'on':''}" data-act="wsex" data-s="f">Donna</button></div>
  <div class="fld"><label>Età</label><input id="w-age" type="number" inputmode="numeric" value="${p.age}"></div>
  <div class="fld"><label>Peso (kg)</label><input id="w-w" type="number" inputmode="decimal" value="${p.weight}"></div>
  <div class="fld"><label>Altezza (cm)</label><input id="w-h" type="number" inputmode="numeric" value="${p.height}"></div>
  <button class="btn" data-act="welcome-ok">Inizia</button></div></div>`);
}

/* ---------- avvio ---------- */
applyTheme();render();
if(!S.onboarded)welcome();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(S.sync.url)doSync(false);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    if(S.sync.url&&Date.now()-lastTry>60000)doSync(false);else render();
  }
});
setInterval(()=>{if(document.visibilityState==='visible'&&view.tab==='today'&&!$('#modal').classList.contains('on'))render()},60000);
</script>
